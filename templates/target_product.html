{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:600px;margin:2rem auto;">
    <h1>{{ product['name'] }}</h1>
    <p style="color:#94a3b8;">{{ product['description'] }}</p>
    <p style="font-size:2rem;color:#38bdf8;font-weight:bold;">₹{{ product['price'] }}</p>
    <a href="/site/" class="btn">← Back to Shop</a>
</div>
{% endblock %}
